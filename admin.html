<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Admin - Prenotazioni</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .code-box { display: flex; gap: 10px; }
        .code-box input { text-align: center; font-weight: bold; letter-spacing: 2px; }
        button {
            background-color: #3b82f6;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 15px;
            padding: 14px;
        }
        button:hover { background-color: #2563eb; }
        #status { margin-top: 15px; font-size: 14px; text-align: center; color: #10b981; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nuova Prenotazione</h2>
    
    <label>Password Admin</label>
    <input type="password" id="adminPass" placeholder="Password Admin">
    
    <label>Email Cliente</label>
    <input type="email" id="emailUtente" placeholder="utente@email.com">
    
    <label>Codice Univoco Generato</label>
    <div class="code-box">
        <input type="text" id="codiceUnivoco" readonly>
        <button type="button" onclick="generaCodice()" style="margin-top:0; width: 120px; background: #475569;">Rigenera</button>
    </div>

    <label>Data e Ora Inizio</label>
    <input type="datetime-local" id="dataInizio">

    <label>Data e Ora Fine (Scadenza)</label>
    <input type="datetime-local" id="dataFine">
    
    <button onclick="inviaPrenotazione()">Registra e Invia Email</button>
    <div id="status">Connessione...</div>
</div>
    <div class="card" style="margin-top: 20px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h3>🔑 Prenotazioni Attive</h3>
    <button onclick="richiediLista()" style="background: #2563eb; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px;">Aggiorna Elenco</button>
    
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b;">
                <th style="padding: 10px;">Email</th>
                <th style="padding: 10px;">Codice</th>
                <th style="padding: 10px;">Scadenza</th>
                <th style="padding: 10px;">Azione</th>
            </tr>
        </thead>
        <tbody id="tabella-prenotazioni">
            <tr><td colspan="4" style="text-align: center; padding: 15px; color: #94a3b8;">Clicca su "Aggiorna Elenco" per caricare le chiavi attive.</td></tr>
        </tbody>
    </table>
</div>

<script>
    const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    const topicAdmin = 'casa99-siracusa/s3-garage-xyz789/admin';

    const client = mqtt.connect(brokerUrl, {
        clientId: 'admin_client_' + Math.random().toString(16).substr(2, 8)
    });

    const statusEl = document.getElementById('status');

    client.on('connect', () => {
        statusEl.innerText = '🟢 Connesso';
    });

    function generaCodice() {
        const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('codiceUnivoco').value = randomCode;
    }
    generaCodice();

    function inviaPrenotazione() {
        const adminSecret = document.getElementById('adminPass').value;
        const email = document.getElementById('emailUtente').value;
        const codice = document.getElementById('codiceUnivoco').value;
        const startStrInput = document.getElementById('dataInizio').value;
        const endStrInput = document.getElementById('dataFine').value;

        if (!adminSecret || !email || !startStrInput || !endStrInput) {
            alert('Compila tutti i campi!');
            return;
        }

        const startTs = Math.floor(new Date(startStrInput).getTime() / 1000);
        const endTs = Math.floor(new Date(endStrInput).getTime() / 1000);

        if (endTs <= startTs) {
            alert('La data di fine deve essere successiva a quella di inizio!');
            return;
        }

        const payload = JSON.stringify({
            admin_secret: adminSecret,
            email: email,
            codice: codice,
            start_ts: startTs,
            end_ts: endTs,
            start_str: startStrInput.replace('T', ' '),
            end_str: endStrInput.replace('T', ' ')
        });

        client.publish(topicAdmin, payload, () => {
            statusEl.innerText = `✅ Comando inviato!`;
        });
    }
    const topicAdminStatus = 'casa99-siracusa/s3-garage-xyz789/admin/status';

// Quando il client MQTT si connette, si iscrive anche al topic di stato
client.on('connect', function () {
    console.log('Connesso al broker MQTT');
    client.subscribe(topicAdminStatus);
    richiediLista(); // Carica la lista all'avvio
});

client.on('message', function (topic, payload) {
    if (topic === topicAdminStatus) {
        const data = JSON.parse(payload.toString());
        aggiornaTabella(data.prenotazioni);
    }
});

function richiediLista() {
    const adminSecret = document.getElementById('admin_password').value; // Assicurati che l'input password admin abbia questo ID
    const payload = JSON.stringify({
        admin_secret: adminSecret,
        azione: "get_list"
    });
    client.publish(topicAdmin, payload);
}

function revocaCodice(codiceDaEliminare) {
    const adminSecret = document.getElementById('admin_password').value;
    if (!confirm(`Vuoi davvero revocare in anticipo il codice ${codiceDaEliminare}?`)) return;

    const payload = JSON.stringify({
        admin_secret: adminSecret,
        azione: "elimina",
        codice: codiceDaEliminare
    });
    client.publish(topicAdmin, payload);
    
    // Richiedi subito l'aggiornamento della lista dopo un breve delay
    setTimeout(richiediLista, 800);
}

function aggiornaTabella(prenotazioni) {
    const tbody = document.getElementById('tabella-prenotazioni');
    tbody.innerHTML = '';

    if (!prenotazioni || prenotazioni.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 15px; color: #94a3b8;">Nessuna prenotazione attiva.</td></tr>';
        return;
    }

    prenotazioni.forEach(p => {
        const dataScadenza = new Date(p.end * 1000).toLocaleString();
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #f1f5f9';
        tr.innerHTML = `
            <td style="padding: 10px;">${p.email}</td>
            <td style="padding: 10px; font-weight: bold; font-family: monospace;">${p.codice}</td>
            <td style="padding: 10px;">${dataScadenza}</td>
            <td style="padding: 10px;"><button onclick="revocaCodice('${p.codice}')" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">Revoca</button></td>
        `;
        tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
