<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piazza Marina</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #E59C20;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        .card {
            background: #3A4F30;
            padding: 25px;
            border-radius: 16px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .icona-titolo {
            width: 20%;            /* Larghezza quadrata */
            height: 20%;           /* Altezza quadrata */
            flex-shrink: 0;         /* Evita che venga schiacciata */
            object-fit: contain;    /* Mostra l'immagine intera sul fondo bianco senza tagliarla */
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 18px;
            margin: 8px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.97); }
        .btn-portone { background-color: #2563eb; color: white; }
        .btn-porta { background-color: #10b981; color: white; }
        #status { font-size: 14px; color: #9ca3af; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>
        <img src="piazzamarina-logo.png" alt="Piazza Marina" class="icona-titolo">
    </h2>
    <input type="password" id="pin" placeholder="Inserisci PIN" inputmode="numeric">
    
    <button class="btn-portone" onclick="inviaComando('PORTONE')">APRI PORTONE</button>
    <button class="btn-porta" onclick="inviaComando('PORTA')">APRI PORTA</button>
    
</div>

<script>
    // Configurazione Broker MQTT (esempio broker pubblico EMQX con WSS)
    // Per uso reale usa un'istanza gratuita privata su HiveMQ Cloud o EMQX Cloud con user/password
    const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    const topicComando = 'casa99-siracusa/s3-garage-xyz789/comando';

    function inviaComando(target) {
        // Legge il codice inserito dall'input
        const codiceInserito = document.getElementById('pin').value;
        if (!codiceInserito) {
            alert('Inserisci il codice!');
            return;
        }

        // Crea il payload JSON usando la chiave "codice" (esattamente come l'ESP32)
        const payload = JSON.stringify({
            codice: codiceInserito,
            azione: target
        });

        // Pubblica sul topic dei comandi
        client.publish(topicComando, payload);
        
        statusEl.innerText = `Comando ${target} inviato...`;
        setTimeout(() => {
            statusEl.innerText = '🟢 Connesso e pronto';
        }, 2500);
    }
</script>

</body>
</html>
