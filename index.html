<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piazza Marina</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #E59C20;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        .card {
            background: #3A4F30;
            padding: 25px;
            border-radius: 16px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .icona-titolo {
            width: 50%;
            height: 50%;
            flex-shrink: 0;
            object-fit: contain;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #ffffff;
            opacity: 0.7;
        }
        button {
            width: 100%;
            padding: 18px;
            margin: 8px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.97); }
        .btn-portone { background-color: #2563eb; color: white; }
        .btn-porta { background-color: #10b981; color: white; }
        #status { font-size: 14px; color: #e2e8f0; margin-top: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h2>
        <img src="piazzamarina-logo.png" alt="Piazza Marina" class="icona-titolo">
    </h2>
    <input type="password" id="pin" placeholder="Inserisci PIN" inputmode="numeric">
    
    <button class="btn-portone" onclick="inviaComando('PORTONE')">OPEN BUILDING ENTRANCE(APRI PORTONE)</button>
    <button class="btn-porta" onclick="inviaComando('PORTA')">OPEN APARTMENT(APRI APPARTAMENTO)</button>

    <div id="status">⏳ Connessione al broker...</div>
</div>

<script>
    const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    const topicComando = 'casa99-siracusa/s3-garage-xyz789/comando';
    const statusEl = document.getElementById('status');

    const client = mqtt.connect(brokerUrl, {
        clientId: 'web_pm_' + Math.random().toString(16).substring(2, 8)
    });

    client.on('connect', function () {
        statusEl.innerText = '🟢 Connesso e pronto';
    });

    client.on('reconnect', function () {
        statusEl.innerText = '🟡 Riconnessione in corso...';
    });

    client.on('error', function (err) {
        console.error('Errore MQTT:', err);
        statusEl.innerText = '🔴 Errore connessione broker';
    });

    function inviaComando(target) {
        const codiceInserito = document.getElementById('pin').value.trim();
        if (!codiceInserito) {
            alert('Inserisci il codice!');
            return;
        }

        if (!client.connected) {
            statusEl.innerText = '🔴 Non connesso al broker, riprova tra un attimo';
            return;
        }

        const payload = JSON.stringify({
            codice: codiceInserito,
            azione: target
        });

        client.publish(topicComando, payload, {}, (err) => {
            if (err) {
                statusEl.innerText = '🔴 Errore invio comando';
                return;
            }
            statusEl.innerText = `Comando ${target} inviato...`;
            setTimeout(() => {
                if (client.connected) {
                    statusEl.innerText = '🟢 Connesso e pronto';
                }
            }, 2500);
        });
    }
</script>

</body>
</html>
